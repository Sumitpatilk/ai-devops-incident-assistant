services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: "1000"
        APP_GID: "1000"
    container_name: incident-assistant-backend
    environment:
      INCIDENT_DB_PATH: /app/data/incident_memory.db
    volumes:
      - incident-assistant-db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: incident-assistant-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  incident-assistant-db-data:
    external: true
